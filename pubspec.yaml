name: tongyi_lite
description: 端侧离线 AI 智能体
# 版本号以 android/app/build.gradle.kts (versionName=0.2.1 / versionCode=9) 为准，
# 此处同步保持一致，About 页版本号运行时从安装包读取（package_info_plus）。
# 注意：About 页版本号是 Dart 常量（settings_screen.dart），与 gradle 同步；
# 离线沙箱无法下载 package_info_plus 的 AGP 依赖，故不引插件读取。
version: 0.2.8+16
publish_to: 'none'

environment:
  sdk: '>=3.6.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.6.1
  # Storage
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  # HTTP (model download)
  dio: ^5.7.0
  # Permissions
  permission_handler: ^11.3.1
  # Image picker
  image_picker: ^1.1.2
  # Open external URLs (About GitHub link)
  url_launcher: ^6.3.0
  # 智能体文件上传（办公格式附件注入，≤5 个）
  file_picker: ^8.1.2
  # 附件解析：docx/xlsx/pptx 本质是 zip（纯 Dart 解包抽 XML 文本）。
  # PDF 全文抽取暂缺纯 Dart 可行方案（pdf_text_extraction 与 SDK 约束冲突），
  # v1 对 PDF 原样保存并在提示词中明确告知模型不可解析。
  archive: ^3.6.1
  # 智能体回答 markdown 美化渲染
  flutter_markdown: ^0.7.4+3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # 纯 Dart SQLite（测试用）：StorageService 的真库行为（取尾语义/迁移）可在
  # flutter test 里直接验证，无需真机/模拟器。
  sqflite_common_ffi: ^2.3.3


flutter:
  uses-material-design: true
  assets:
    - assets/models_catalog.json
