name: tongyi_lite
description: 端侧离线 AI 智能体
# 版本号以 android/app/build.gradle.kts (versionName=0.2.1 / versionCode=9) 为准，
# 此处同步保持一致，About 页版本号运行时从安装包读取（package_info_plus）。
# 注意：About 页版本号是 Dart 常量（settings_screen.dart），与 gradle 同步；
# 离线沙箱无法下载 package_info_plus 的 AGP 依赖，故不引插件读取。
version: 0.2.9+17
publish_to: 'none'

environment:
  sdk: '>=3.6.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.6.1
  # Storage
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  # HTTP (model download)
  dio: ^5.7.0
  # Permissions
  permission_handler: ^11.3.1
  # Image picker
  image_picker: ^1.1.2
  # Open external URLs (About GitHub link)
  url_launcher: ^6.3.0
  # 智能体文件上传（办公格式附件注入，≤5 个）
  file_picker: ^8.1.2
  # 附件解析：docx/xlsx/pptx 本质是 zip（纯 Dart 解包抽 XML 文本）。
  # PDF 全文抽取走 TomRoush/PdfBox-Android 原生桥（Kotlin，见 native_pdf_service.dart），
  # 已替代原手搓纯 Dart 解析器（pdf_text_extractor，2026-09-30 弃用删除）。
  archive: ^3.6.1
  # 智能体回答 markdown 美化渲染
  flutter_markdown: ^0.7.4+3
  # Dev Agent：自动生成 ed25519 SSH 密钥对（TweetNaCl 移植，无外部依赖）
  pinenacl: ^0.6.0
  flutter_secure_storage: ^10.3.4
  sherpa_onnx: 1.13.8
  record: 6.2.1
  background_downloader: 8.9.5
  lpinyin: 2.0.3
  # Edge 在线 TTS（免费 neural 语音，Sec-MS-GEC 本地 token，纯 Dart WebSocket）
  edge_tts: ^0.1.5
  # TTS/语音消息播放（本地 mp3 文件）
  audioplayers: ^6.4.0
  # TTS 缓存 key（sha256，与 vendored edge_tts 同版本约束）
  crypto: ^3.0.0


dependency_overrides:
  # Dev Agent SSH 开发环境：本地 vendored dartssh2 fork
  # （含 zlib 压缩/批处理解密优化，源自 DSH-Phone 真机验证的 fork）。
  dartssh2:
    path: third_party/dartssh2
  # Edge 在线 TTS：vendored edge_tts 0.1.5（上游要求 Dart ≥3.10.8，
  # 本机 Flutter 3.27/Dart 3.6.0 装不上；代码本身无超纲 API，放宽 SDK 约束）。
  edge_tts:
    path: third_party/edge_tts
  # 包体瘦身（2026-10-08）：sherpa_onnx_web 的 wasm/js assets（压缩 4.3MB）会被
  # Flutter 无差别打进 Android 包但运行期零使用（ASR 走 android_arm64 native 库）。
  # vendored stub 去掉 assets 声明；仅影响 web 目标（本项目不构建 web）。
  sherpa_onnx_web:
    path: third_party/sherpa_onnx_web


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # 纯 Dart SQLite（测试用）：StorageService 的真库行为（取尾语义/迁移）可在
  # flutter test 里直接验证，无需真机/模拟器。
  sqflite_common_ffi: ^2.3.3


flutter:
  uses-material-design: true
  assets:
    - assets/models_catalog.json
