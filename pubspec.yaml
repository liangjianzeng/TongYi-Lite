name: tongyi_lite
description: 端侧离线 AI 智能体
# 版本号以 android/app/build.gradle.kts (versionName=0.1.6 / versionCode=7) 为准，
# 此处同步保持一致，About 页版本号运行时从安装包读取（package_info_plus）。
# 注意：About 页版本号是 Dart 常量（settings_screen.dart），与 gradle 同步；
# 离线沙箱无法下载 package_info_plus 的 AGP 依赖，故不引插件读取。
version: 0.1.6+7
publish_to: 'none'

environment:
  sdk: '>=3.6.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.6.1
  # Storage
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  # HTTP (model download)
  dio: ^5.7.0
  # Permissions
  permission_handler: ^11.3.1
  # Image picker
  image_picker: ^1.1.2
  # Open external URLs (About GitHub link)
  url_launcher: ^6.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/models_catalog.json
