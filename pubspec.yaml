name: tongyi_lite
description: 端侧离线 AI 智能体
version: 0.1.0+1
publish_to: 'none'

environment:
  sdk: '>=3.6.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  # UI
  flutter_markdown: ^0.7.4
  google_fonts: ^6.2.1
  # State management
  flutter_riverpod: ^2.6.1
  # Storage
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  # HTTP (model download)
  dio: ^5.7.0
  # Image
  image_picker: ^1.1.2
  # TTS
  flutter_tts: ^4.2.0
  # Permissions
  permission_handler: ^11.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true
